<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>时光纪念</title>
<style>
:root {
  --primary: #8B5CF6;
  --primary-light: #C4B5FD;
  --primary-dark: #6D28D9;
  --bg: #F5F5FA;
  --card-bg: #FFFFFF;
  --text: #1A1A2E;
  --text-secondary: #6B7280;
  --tag-love: #FF6B9D;
  --tag-birthday: #FF9F43;
  --tag-travel: #54A0FF;
  --tag-work: #5F27CD;
  --tag-other: #636E72;
  --tag-favorite: #EE5A24;
  --tag-collection: #EE5A24;
  --shadow: 0 4px 20px rgba(139, 92, 246, 0.15);
  --fab-shadow: rgba(139, 92, 246, 0.45);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  /* 状态栏高度：由 JS 从 URL 参数 sat= 注入，fallback 到 env() 再 fallback 到 48px */
  --sb-height: 48px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ========== 可滚动内容区 ========== */
.scroll-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ========== 头部 ========== */
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  padding: calc(var(--sb-height, env(safe-area-inset-top, 20px)) + 12px) 20px 24px;
  border-radius: 0 0 28px 28px;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  top: -40%;
  right: -20%;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.header h1 {
  color: #fff;
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 4px;
}
.header p {
  color: rgba(255,255,255,0.8);
  font-size: 13px;
}

/* ========== 搜索栏 ========== */
.search-bar {
  margin: -16px 16px 0;
  position: relative;
  z-index: 10;
}
.search-bar input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border: none;
  border-radius: 14px;
  background: var(--card-bg);
  font-size: 15px;
  color: var(--text);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  outline: none;
}
.search-bar input::placeholder { color: #C4C4C4; }
.search-bar .search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #C4C4C4;
}

/* ========== 分类标签 ========== */
.tabs {
  display: flex;
  gap: 8px;
  padding: 16px 16px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  background: var(--card-bg);
  color: var(--text-secondary);
  border: 1px solid #EEE;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 3px 12px rgba(124, 92, 252, 0.3);
}

/* ========== 精选回忆 ========== */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 16px 8px;
}
.section-header h2 {
  font-size: 18px;
  font-weight: 700;
}
.section-header .sort-btn {
  font-size: 13px;
  color: var(--primary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
}
.section-header .sort-btn:active { background: rgba(124, 92, 252, 0.1); }

.featured-scroll {
  display: flex;
  gap: 12px;
  padding: 0 16px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.featured-scroll::-webkit-scrollbar { display: none; }
.featured-card {
  flex-shrink: 0;
  width: 200px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--card-bg);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s;
}
.featured-card:active { transform: scale(0.96); }
.featured-card .card-img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: linear-gradient(135deg, #667eea, #764ba2);
}
.featured-card .card-info {
  padding: 10px 12px;
}
.featured-card .card-tag {
  display: inline-block;
  font-size: 10px;
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  margin-bottom: 4px;
}
.featured-card .card-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.featured-card .card-date {
  font-size: 11px;
  color: var(--text-secondary);
}

/* ========== 纪念日列表 ========== */
.memorial-list {
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.memorial-card {
  border-radius: 18px;
  overflow: hidden;
  background: var(--card-bg);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s;
}
.memorial-card:active { transform: scale(0.98); }
.memorial-card .card-cover {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: linear-gradient(135deg, #a18cd1, #fbc2eb);
}
.memorial-card .card-body {
  padding: 14px 16px;
}
.memorial-card .tag-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.memorial-card .tag {
  display: inline-block;
  font-size: 11px;
  color: #fff;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 500;
}
.memorial-card .card-name {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
}
.memorial-card .card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.memorial-card .card-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.memorial-card .days {
  font-size: 32px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}
.memorial-card .days span {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-left: 2px;
}
.memorial-card .date-info {
  text-align: right;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ========== 空状态 ========== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 56px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ========== FAB ========== */
.fab {
  position: fixed !important;
  bottom: 80px !important;
  right: 20px !important;
  width: clamp(52px, 8vw, 64px) !important;
  height: clamp(52px, 8vw, 64px) !important;
  border-radius: 50% !important;
  background: linear-gradient(135deg, var(--primary), var(--primary-light)) !important;
  color: #fff !important;
  font-size: 28px !important;
  border: none !important;
  box-shadow: 0 6px 24px var(--fab-shadow) !important;
  cursor: pointer !important;
  z-index: 9999 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: transform 0.2s !important;
  line-height: 1 !important;
  -webkit-tap-highlight-color: transparent !important;
  visibility: visible !important;
  opacity: 1 !important;
  pointer-events: auto !important;
}
.fab:active { transform: scale(0.9) !important; }
body:has(.modal-overlay.show) .fab { display: none !important; }
body:has(.detail-overlay.show) .fab { display: none !important; }

/* ========== 添加弹窗 ========== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-sheet {
  background: var(--card-bg);
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-height: calc(92vh - var(--sb-height, 48px));
  overflow-y: auto;
  padding: 0;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 20px 12px;
  position: sticky;
  top: 0;
  background: var(--card-bg);
  border-radius: 24px 24px 0 0;
  z-index: 10;
}
.modal-header h3 {
  font-size: 18px;
  font-weight: 700;
}
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #F3F4F6;
  border: none;
  font-size: 18px;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-body {
  padding: 0 20px 24px;
}
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.form-group label .required {
  color: #EF4444;
  margin-left: 2px;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 12px;
  font-size: 15px;
  color: var(--text);
  background: #FAFAFC;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus {
  border-color: var(--primary);
  background: #fff;
}
textarea.form-input {
  resize: none;
  height: 80px;
}

/* 分类选择 */
.category-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.cat-option {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  background: #F3F4F6;
  color: var(--text-secondary);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.cat-option .cat-delete {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #EF4444;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(239,68,68,0.4);
  cursor: pointer;
  z-index: 5;
  line-height: 1;
  animation: catPopIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.cat-option.deletable .cat-delete {
  display: flex;
}
.cat-option.deletable {
  animation: catShake 0.3s ease-in-out;
}
.edit-banner {
  display: none; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px; margin: 0 0 8px; border-radius: 10px;
  background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 500;
  animation: editBannerIn .3s ease;
}
.edit-banner.show { display: flex; }
@keyframes editBannerIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
@keyframes catPopIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes catShake {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-3deg); }
  75% { transform: rotate(3deg); }
}
.cat-option.active {
  border-color: var(--primary);
  background: rgba(124, 92, 252, 0.08);
  color: var(--primary);
}
.cat-option-add {
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: transparent;
  color: var(--primary);
  border: 1.5px dashed var(--primary);
  cursor: pointer;
  transition: all 0.2s;
  opacity: 0.7;
}
.cat-option-add:hover, .cat-option-add:active {
  opacity: 1;
  background: rgba(124, 92, 252, 0.06);
}

/* 图片上传 */
.image-upload-area {
  border: 2px dashed #D1D5DB;
  border-radius: 14px;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #FAFAFC;
  position: relative;
  overflow: hidden;
}
.image-upload-area:active {
  border-color: var(--primary);
  background: rgba(124, 92, 252, 0.04);
}
.image-upload-area .upload-icon {
  font-size: 36px;
  margin-bottom: 8px;
}
.image-upload-area p {
  font-size: 13px;
  color: var(--text-secondary);
}
.image-upload-area p span {
  color: var(--primary);
  font-weight: 600;
}
.image-upload-area input[type="file"] {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0;
  cursor: pointer;
}

/* 图片预览 */
.image-preview-container {
  position: relative;
  display: none;
  margin-top: 10px;
  border-radius: 12px;
  overflow: hidden;
}
.image-preview-container.show { display: block; }
.image-preview-container img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 12px;
}
.image-preview-container .remove-img {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ========== 封面位置选择器 ========== */
.position-picker {
  display: none;
  margin-top: 12px;
  background: #F8F9FA;
  border-radius: 14px;
  padding: 14px;
}
.position-picker.show { display: block; }
.position-picker-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
}
.position-preview {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  margin-bottom: 12px;
  background: #E5E7EB;
}
.position-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: object-position 0.15s ease;
}
.position-preview .crop-hint {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 8px;
  pointer-events: none;
}
.position-slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.position-slider-row .pos-icon {
  font-size: 14px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.position-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: #E5E7EB;
  outline: none;
}
.position-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(124,92,252,0.3);
}

/* 收藏开关 */
.favorite-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
}
/* ========== 详情弹窗（增强版） ========== */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.detail-overlay.show { opacity: 1; pointer-events: auto; }
.detail-sheet {
  background: var(--card-bg); width: 100%; max-height: 90vh;
  border-radius: 24px 24px 0 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: calc(24px + var(--safe-bottom));
}
.detail-overlay.show .detail-sheet { transform: translateY(0); }

/* 封面 */
.detail-cover {
  width: 100%; height: 240px; object-fit: cover; display: block;
  border-radius: 24px 24px 0 0;
  cursor: pointer; transition: filter 0.2s;
}
.detail-cover:active { filter: brightness(0.92); }
.detail-cover-placeholder {
  width: 100%; height: 240px; display: flex; align-items: center; justify-content: center;
  border-radius: 24px 24px 0 0; font-size: 72px; color: rgba(255,255,255,0.6);
}

/* 头部 */
.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 20px 0; gap: 12px;
}
.detail-title {
  font-size: 22px; font-weight: 700; color: var(--text); flex: 1; line-height: 1.3;
}
.detail-close {
  width: 32px; height: 32px; border-radius: 50%; background: #F3F4F6;
  border: none; font-size: 18px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); transition: background 0.2s;
}
.detail-close:active { background: #E5E7EB; }

/* 信息区 */
.detail-info { padding: 16px 20px; }

/* 标签行 */
.detail-tag-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.detail-tag { padding: 5px 14px; border-radius: 12px; font-size: 12px; color: #fff; font-weight: 600; letter-spacing: 0.3px; }

/* 倒计时区域 */
.detail-countdown {
  text-align: center; padding: 20px 0 16px; position: relative;
}
.detail-countdown .big-num {
  font-size: 64px; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, var(--primary), #A78BFA);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.detail-countdown .big-unit {
  font-size: 18px; color: var(--text-secondary); margin-left: 4px; font-weight: 600;
}
.detail-countdown .countdown-sub {
  font-size: 13px; color: var(--text-secondary); margin-top: 6px;
}
.detail-countdown.is-today .big-num {
  font-size: 52px;
  background: linear-gradient(135deg, #FF6B9D, #FF9F43);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.detail-countdown.is-today .celebration {
  font-size: 28px; margin-top: 4px; display: block;
  animation: celebBounce 1.5s ease-in-out infinite;
}
@keyframes celebBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.detail-countdown.is-past .big-num {
  background: linear-gradient(135deg, #9CA3AF, #D1D5DB);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 信息卡片网格 */
.detail-cards {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.detail-card {
  background: #F8F9FA; border-radius: 14px; padding: 12px 10px; text-align: center;
}
.detail-card .card-icon { font-size: 20px; margin-bottom: 4px; }
.detail-card .card-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
.detail-card .card-value { font-size: 13px; color: var(--text); font-weight: 600; }

/* 信息行 */
.detail-row {
  display: flex; align-items: center; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid #F3F4F6; font-size: 14px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row .label { width: 70px; flex-shrink: 0; color: var(--text-secondary); }
.detail-row .value { color: var(--text); font-weight: 500; flex: 1; }

/* 描述框 */
.detail-desc-box {
  background: #F8F9FA; border-radius: 14px; padding: 16px;
  font-size: 14px; color: var(--text-secondary); line-height: 1.7;
  margin-top: 16px; border-left: 3px solid var(--primary);
}

/* 分割线 */
.detail-divider { height: 1px; background: #F3F4F6; margin: 4px 0; }

/* 操作按钮 */
.detail-actions { display: flex; gap: 12px; padding: 12px 20px 0; }
.btn-edit, .btn-delete {
  flex: 1; padding: 14px; border-radius: 14px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-edit { background: rgba(124, 92, 252, 0.1); color: var(--primary); }
.btn-edit:active { background: rgba(124, 92, 252, 0.2); }
.btn-delete { background: #FFF0F0; color: #EF4444; }

// ========== 状态栏高度注入 ==========

// Android WebView 中 env(safe-area-inset-top) 不可靠（小米等厂商），必须用原生传值兜底
(function() {
  try {
    var params = new URLSearchParams(window.location.search);
    var sat = parseFloat(params.get('sat'));
    if (sat && sat > 0) {
      document.documentElement.style.setProperty('--sb-height', sat + 'px');
    }
  } catch(e) {}
})();

// ========== 数据层 ==========
const STORAGE_KEY = 'time_memorial_data';

const CUSTOM_CATS_KEY = 'time_memorial_custom_cats';
const CUSTOM_COLORS = ['#FF6B9D','#FF9F43','#54A0FF','#5F27CD','#636E72','#00B894','#E17055','#0984E3','#6C5CE7','#FD79A8'];

function loadCustomCats() {

const builtinCategoryMap = {

function renderTabs() {

// ========== 长按删除分类 ==========
let catLongPressTimer = null;
let catEditMode = false;
let catEditTimer = null;

function bindCatLongPress(el) {
  let moved = false;
  let startX = 0, startY = 0;
  const start = (e) => {
    moved = false;
    if (e.type === 'touchstart') {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    } else {
      startX = e.clientX;
      startY = e.clientY;
    }
    catLongPressTimer = setTimeout(() => {
      if (moved) return;
      enterCatEditMode();
      el.classList.add('deletable');
      if (navigator.vibrate) navigator.vibrate(30);
    }, 500);
  };
  const end = () => { clearTimeout(catLongPressTimer); };
  const move = (e) => {
    const cx = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const cy = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
    if (Math.abs(cx - startX) > 12 || Math.abs(cy - startY) > 12) {
      moved = true;
      clearTimeout(catLongPressTimer);
    }
  };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

function enterCatEditMode() {
  if (catEditMode) return;
  catEditMode = true;
  document.querySelectorAll('.cat-option').forEach(el => el.classList.add('deletable'));
  document.getElementById('editBanner').classList.add('show');
  clearTimeout(catEditTimer);
  catEditTimer = setTimeout(() => { exitCatEditMode(); }, 8000);
}

function exitCatEditMode() {
  catEditMode = false;
  clearTimeout(catEditTimer);
  document.querySelectorAll('.cat-option').forEach(el => el.classList.remove('deletable'));
  document.getElementById('editBanner').classList.remove('show');
}

async function requestDeleteCat(key) {
  const cat = categoryMap[key];
  if (!cat) return;
  // 统计关联纪念日数量
  const count = memorials.filter(m => m.category === key).length;
  const msg = count > 0
    ? `删除分类「${cat.label}」后，首页中属于该分类的 ${count} 条纪念日也将一并删除，确认吗？`
    : `确认删除分类「${cat.label}」吗？`;
  const confirmed = await showConfirm(msg);
  if (!confirmed) { exitCatEditMode(); return; }
  // 删除关联纪念日
  memorials = memorials.filter(m => m.category !== key);
  saveData();
  syncToNative();
  // 删除自定义分类 / 内置分类置灰标记
  if (key.startsWith('custom_')) {
    delete customCats[key];
    saveCustomCats(customCats);
    categoryMap = { ...builtinCategoryMap, ...customCats };
  } else {
    // 内置分类：从 categoryMap 中移除（本次会话内）
    delete categoryMap[key];
  }
  // 如果当前选中的是被删分类，重置为 love
  if (selectedCategory === key) selectedCategory = 'love';
  renderCategoryGrid();
  renderTabs();
  renderList();
  renderFeatured();
  exitCatEditMode();
  setTimeout(() => showToast(count > 0 ? `已删除「${cat.label}」及 ${count} 条纪念日` : `已删除「${cat.label}」`), 300);
}

    categoryMap = { ...builtinCategoryMap, ...customCats };
    selectedCategory = key;
    renderCategoryGrid();
    renderTabs();
    setTimeout(() => showToast('✅ 分类已添加'), 50);
  });
});

// ── 纪念日数据同步到原生端 ──

}

let memorials = loadData() || [];

let currentFilter = 'all';

let searchQuery = '';
let selectedCategory = 'love';

let imagePosition = 50; // 0=顶部, 50=居中, 100=底部

// 解析图片路径：文件名 → nativeBridge 路径，base64 → 直接返回
function resolveImageSrc(img) {

  if (img.startsWith('data:')) return img;

    const path = nativeBridge.getImagePath(img);
    return path ? 'file://' + path : '';

// ========== 农历转公历（1998-2030） ==========
function lunarToSolar(dateStr) {
  const parts = dateStr.split('-');
  const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
  if (!y || !m || !d || m > 13 || d > 31) return dateStr;
  // 农历数据：低12位=1-12月大小月(1=30天,0=29天)，高4位=闰月月份(0=无闰月)
  // 闰月天数固定：数据对应年份闰月29天，数据+1=对应年份闰月30天（通过比较当前和下一年数据推断）
  const lunarData = [
    0x04bd,0x04ae,0x0a57,0x054d,0x0d26,0x0d95,0x1655,0x056a,0x09ad,0x055d, // 1900-1909
    0x04ae,0x0a5b,0x0a4d,0x0d25,0x1d25,0x0b54,0x0b6a,0x096d,0x04af,0x0497, // 1910-1919
    0x0a4b,0x0b4b,0x06a5,0x06d4,0x1ab5,0x02b6,0x0957,0x052f,0x0497,0x0656, // 1920-1929
    0x0d4a,0x0ea5,0x16a9,0x05ad,0x02b6,0x096e,0x04af,0x0c97,0x0a4b,0x0d25, // 1930-1939
    0x1d25,0x0b54,0x0b6a,0x095d,0x055a,0x04ad,0x0a4d,0x0d4b,0x1ad2,0x0d25, // 1940-1949
    0x0d52,0x0aaa,0x095b,0x04b6,0x0a57,0x054e,0x0d15,0x1d25,0x0d54,0x0b6a, // 1950-1959
    0x096d,0x05ad,0x055a,0x04ad,0x0a4d,0x0d25,0x0d25,0x1b4a,0x0b56,0x095d, // 1960-1969
    0x055a,0x055d,0x04ae,0x0a4d,0x0d1b,0x0d25,0x0d52,0x0aaa,0x095b,0x04b6, // 1970-1979
    0x0a57,0x054e,0x0d16,0x0d25,0x0d54,0x0b6a,0x096d,0x05ad,0x055a,0x04ad, // 1980-1989
    0x0a4d,0x0d25,0x1d25,0x0b4a,0x0b56,0x055d,0x052d,0x0a5b,0x0a4d,0x0d25, // 1990-1999
    0x1d52,0x0aaa,0x095b,0x04b6,0x0a57,0x054e,0x0d16,0x1695,0x0d54,0x0b6a, // 2000-2009
    0x096d,0x05ad,0x055a,0x04ad,0x0a4d,0x0d25,0x1d25,0x0b4a,0x1b56,0x055d, // 2010-2019
    0x052d,0x0a5b,0x0a4d,0x0d25,0x1d52,0x0aaa,0x095b,0x04b6,0x0a57,0x054e, // 2020-2029
    0x0d15 // 2030
  ];
  const idx = y - 1900;
  if (idx < 0 || idx >= lunarData.length) return dateStr;
  const data = lunarData[idx];
  const leapMonth = (data >> 20) & 0xf;
  let bigMonths = data & 0xfff; // 低12位

  // 计算该年正月初一的公历日期
  // 基准：1900年正月初一 = 1900-01-31
  const baseSolar = new Date(1900, 0, 31); // 1900-01-31
  let totalDays = 0;
  for (let yy = 1900; yy < y; yy++) {
    const d2 = lunarData[yy - 1900];
    totalDays += 348; // 12 * 29 = 348（平年基准）
    // 大月额外天数
    let bm = d2 & 0xfff;
    for (let bit = 0; bit < 12; bit++) { if (bm & (1 << bit)) totalDays++; }
    // 闰月额外天数
    const lm = (d2 >> 20) & 0xf;
    if (lm > 0) {
      const leapBig = (d2 >> 16) & 0xf;
      totalDays += (leapBig ? 30 : 29);
    }
  }

  // 加上目标年中到目标月之前的天数
  // 月份天数表
  const monthDays = [];
  for (let i = 0; i < 12; i++) {
    monthDays.push((bigMonths & (1 << i)) ? 30 : 29);
  }

  let dayOffset = 0;
  for (let mm = 1; mm < m; mm++) {
    if (mm === leapMonth + 1) {
      // 闰月在当前月之前，先加闰月天数
      const leapBig = (data >> 16) & 0xf;
      dayOffset += leapBig ? 30 : 29;
    }
    dayOffset += monthDays[mm - 1];
  }

  // 如果目标月就是闰月（即 m 是闰月后的重复月份）
  // 约定：dateType='lunar' 且有闰月时，m>leapMonth 表示闰月后的月份
  // 闰月本身的天数
  if (leapMonth > 0 && m === leapMonth) {
    // 如果是闰月本身（用 m=13 表示闰月）
  } else if (leapMonth > 0 && m === 13) {
    // m=13 表示闰月
    for (let mm = 1; mm <= leapMonth; mm++) dayOffset += monthDays[mm - 1];
  }

  dayOffset += d - 1;
  const result = new Date(baseSolar);
  result.setDate(result.getDate() + totalDays + dayOffset);
  const ry = result.getFullYear(), rm = result.getMonth() + 1, rd = result.getDate();
  return ry + '-' + String(rm).padStart(2, '0') + '-' + String(rd).padStart(2, '0');
}

// ========== 工具函数 ==========
function daysBetween(dateStr, dataType) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const actualDateStr = (dataType === 'lunar') ? lunarToSolar(dateStr) : dateStr;
  const target = new Date(actualDateStr);
  target.setHours(0,0,0,0);
  return Math.floor((now - target) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function isBirthday(m) {
  return m.category === 'birthday' || (m.tags && m.tags.includes('生日')) || (m.title && m.title.includes('生日'));
}

function daysUntilNextBirthday(dateStr, dataType) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const actualDateStr = (dataType === 'lunar') ? lunarToSolar(dateStr) : dateStr;
  const birth = new Date(actualDateStr);
  const thisYear = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
  thisYear.setHours(0,0,0,0);
  if (thisYear < now) {
    thisYear.setFullYear(thisYear.getFullYear() + 1);
  }
  return Math.floor((thisYear - now) / (1000 * 60 * 60 * 24));
}

function getAge(dateStr) {
  const now = new Date();
  const birth = new Date(dateStr);
  let age = now.getFullYear() - birth.getFullYear();
  if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) {
    age--;
  }
  return age;
}

function showCustomCatPrompt() {
  return new Promise(resolve => {
    const overlay = document.getElementById('ccOverlay');
    const input = document.getElementById('ccInput');
    const okBtn = document.getElementById('ccOk');
    const cancelBtn = document.getElementById('ccCancel');
    overlay.classList.add('show');
    input.value = '';
    okBtn.disabled = true;
    setTimeout(() => input.focus(), 300);

    const validate = () => { okBtn.disabled = !input.value.trim(); };
    input.addEventListener('input', validate);

    const cleanup = () => {
      overlay.classList.remove('show');
      input.removeEventListener('input', validate);
      input.removeEventListener('keydown', onKey);
      cancelBtn.removeEventListener('click', onCancel);
      okBtn.removeEventListener('click', onOk);
      overlay.removeEventListener('click', onBg);
    };
    const onCancel = () => { cleanup(); resolve(null); };
    const onOk = () => {
      if (!input.value.trim()) return;
      const name = input.value.trim();
      const activeColor = document.querySelector('#ccColors .cc-color.active');
      const color = activeColor ? activeColor.dataset.color : CUSTOM_COLORS[0];
      cleanup(); resolve({ name, color });
    };
    const onBg = (e) => { if (e.target === overlay) { cleanup(); resolve(null); } };
    const onKey = (e) => { if (e.key === 'Enter') onOk(); if (e.key === 'Escape') onCancel(); };

    cancelBtn.addEventListener('click', onCancel);
    okBtn.addEventListener('click', onOk);
    overlay.addEventListener('click', onBg);
    input.addEventListener('keydown', onKey);
  });
}

function showConfirm(text) {
  return new Promise(resolve => {
    const overlay = document.getElementById('dcOverlay');
    document.getElementById('dcText').textContent = text;
    overlay.classList.add('show');
    const cleanup = () => {
      overlay.classList.remove('show');
      document.getElementById('dcCancel').removeEventListener('click', onCancel);
      document.getElementById('dcOk').removeEventListener('click', onOk);
      overlay.removeEventListener('click', onBg);
    };
    const onCancel = () => { cleanup(); resolve(false); };
    const onOk = () => { cleanup(); resolve(true); };
    const onBg = (e) => { if (e.target === overlay) { cleanup(); resolve(false); } };
    document.getElementById('dcCancel').addEventListener('click', onCancel);
    document.getElementById('dcOk').addEventListener('click', onOk);
    overlay.addEventListener('click', onBg);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) { console.warn('toast element not found'); return; }
  console.log('[showToast]', msg);
  t.textContent = msg;
  clearTimeout(t._timer);
  // 移除旧 show 以重置过渡
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  t._timer = setTimeout(() => {
    t.classList.remove('show');
  }, 1500);
}

function showAlert(text) {
  return new Promise(resolve => {
    const overlay = document.getElementById('alOverlay');
    document.getElementById('alText').textContent = text;
    overlay.classList.add('show');
    const cleanup = () => {
      overlay.classList.remove('show');
      document.getElementById('alOk').removeEventListener('click', onOk);
      overlay.removeEventListener('click', onBg);
    };
    const onOk = () => { cleanup(); resolve(); };
    const onBg = e => { if (e.target === overlay) { cleanup(); resolve(); } };
    document.getElementById('alOk').addEventListener('click', onOk);
    overlay.addEventListener('click', onBg);
  });
}

function getFilteredData() {
  let list = [...memorials];
  // 分类筛选
  if (currentFilter === 'favorite') {
    list = list.filter(m => m.favorite);
  } else if (currentFilter !== 'all') {
    list = list.filter(m => m.category === currentFilter);
  }
  // 搜索筛选
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(m =>
      m.title.toLowerCase().includes(q) ||
      (m.desc && m.desc.toLowerCase().includes(q))
    );
  }
  // 排序
  list.sort((a, b) => {
    const da = new Date(a.date), db = new Date(b.date);
    return sortOrder === 'asc' ? da - db : db - da;
  });
  return list;
}

// ========== 详情弹窗 ==========
let currentDetailId = null;

function openDetail(id) {
  const m = memorials.find(x => x.id === id);
  if (!m) return;
  currentDetailId = id;

  const cat = categoryMap[m.category] || categoryMap.other;
  const days = daysBetween(m.date, m.dateType);
  const absDays = Math.abs(days);

  // 计算年月
  const actualDate = (m.dateType === 'lunar') ? lunarToSolar(m.date) : m.date;
  const targetDate = new Date(actualDate);
  const now = new Date();
  const diffMs = Math.abs(now - targetDate);
  const totalDays = Math.floor(diffMs / (1000*60*60*24));
  const years = Math.floor(totalDays / 365);
  const months = Math.floor((totalDays % 365) / 30);
  const remainDays = totalDays % 30;

  // 星期几
  const weekDays = ['日','一','二','三','四','五','六'];
  const weekDay = '周' + weekDays[targetDate.getDay()];

  // 状态判断
  const isToday = days === 0;
  const isPast = days > 0;
  const isFuture = days < 0;
  let statusText, statusEmoji;
  if (isToday) { statusText = '就是今天'; statusEmoji = '🎉'; }
  else if (isPast) { statusText = '已过去'; statusEmoji = '⏰'; }
  else { statusText = '即将到来'; statusEmoji = '⏳'; }

  // 相对时间描述
  let relativeText = '';
  if (isToday) relativeText = '今天就是这个日子！';
  else if (absDays === 1) relativeText = isPast ? '昨天刚过' : '明天就到';
  else if (absDays < 7) relativeText = isPast ? absDays + '天前' : '还有' + absDays + '天';
  else if (absDays < 30) relativeText = isPast ? Math.floor(absDays/7) + '周前' : '还有' + Math.floor(absDays/7) + '周';
  else if (absDays < 365) relativeText = isPast ? Math.floor(absDays/30) + '个月前' : '还有' + Math.floor(absDays/30) + '个月';
  else {
    const y = Math.floor(absDays/365);
    const rm = Math.floor((absDays%365)/30);
    relativeText = isPast ? y + '年' + (rm > 0 ? rm + '个月' : '') + '前' : '还有' + y + '年' + (rm > 0 ? rm + '个月' : '');
  }

  // 封面
  const detailPos = m.imagePosition != null ? m.imagePosition : 50;
  document.getElementById('detailCover').innerHTML = m.image
    ? '<img class="detail-cover" src="' + resolveImageSrc(m.image) + '" style="object-position:center ' + detailPos + '%;" alt="" onclick="openFullscreenViewer(this.src)">'
    : '<div class="detail-cover-placeholder" style="background:' + coverBg(m.id) + ';">' + cat.label.slice(0,2) + '</div>';

  // 标题
  document.getElementById('detailTitle').textContent = m.title;

  // 构建信息区域
  let infoHtml = '';

  // 倒计时区域
  const countdownClass = isToday ? 'is-today' : (isPast ? 'is-past' : '');
  infoHtml += '<div class="detail-countdown ' + countdownClass + '">';
  if (isToday) {
    infoHtml += '<span class="big-num">🎉</span>';
    infoHtml += '<div class="countdown-sub">今天就是这个纪念日！</div>';
    infoHtml += '<span class="celebration">🎊🎈🎂</span>';
  } else {
    infoHtml += '<span class="big-num">' + absDays + '</span>';
    infoHtml += '<span class="big-unit">' + (isPast ? '天前' : '天后') + '</span>';
    infoHtml += '<div class="countdown-sub">' + relativeText + '</div>';
  }
  infoHtml += '</div>';

  // 标签行
  infoHtml += '<div class="detail-tag-row">';
  infoHtml += '<span class="detail-tag" style="background:' + cat.color + '">' + cat.label + '</span>';
  if (m.favorite) infoHtml += '<span class="detail-tag" style="background:#EE5A24">❤️ 精选</span>';
  infoHtml += '</div>';

  // 信息卡片网格
  infoHtml += '<div class="detail-cards">';
  infoHtml += '<div class="detail-card"><div class="card-icon">📅</div><div class="card-label">日期</div><div class="card-value">' + formatDate(m.date) + '</div></div>';
  infoHtml += '<div class="detail-card"><div class="card-icon">📆</div><div class="card-label">星期</div><div class="card-value">' + weekDay + '</div></div>';
  infoHtml += '<div class="detail-card"><div class="card-icon">' + statusEmoji + '</div><div class="card-label">状态</div><div class="card-value">' + statusText + '</div></div>';
  infoHtml += '</div>';

  // 详细信息行
  if (years > 0 || months > 0) {
    infoHtml += '<div class="detail-row"><span class="label">⏳ 已过</span><span class="value">';
    if (years > 0) infoHtml += years + '年';
    if (months > 0) infoHtml += months + '个月';
    if (remainDays > 0) infoHtml += remainDays + '天';
    infoHtml += '</span></div>';
  }

  if (isBirthday(m)) {
    infoHtml += '<div class="detail-row"><span class="label">🎂 下一个生日</span><span class="value">' + daysUntilNextBirthday(m.date, m.dateType) + '天后</span></div>';
  } else {
    infoHtml += '<div class="detail-row"><span class="label">📊 天数</span><span class="value">' + absDays + '天（共' + totalDays + '天）</span></div>';
  }

  // 下一个整百/整千天纪念日
  const nextMilestone = Math.ceil(totalDays / 100) * 100;
  if (nextMilestone > totalDays && nextMilestone - totalDays <= 100) {
    const daysToMilestone = nextMilestone - totalDays;
    const milestoneDate = new Date(now.getTime() + daysToMilestone * 86400000);
    infoHtml += '<div class="detail-row"><span class="label">🎯 下个</span><span class="value">第' + nextMilestone + '天 (' + formatDate(milestoneDate.toISOString().slice(0,10)) + ')</span></div>';
  }

  // 描述
  if (m.desc) {
    infoHtml += '<div class="detail-desc-box">📝 ' + m.desc + '</div>';
  }

  document.getElementById('detailInfo').innerHTML = infoHtml;

  document.body.dataset.scrollY = document.querySelector('.scroll-content').scrollTop;
  document.getElementById('detailModal').classList.add('show');
}

    document.getElementById('positionPicker').classList.remove('show');
    document.getElementById('uploadArea').style.display = '';
    // 清除残留图片
    var _pi = document.getElementById('previewImg');
    if (_pi) _pi.src = '';
    var _ppi = document.getElementById('positionPreviewImg');
    if (_ppi) _ppi.src = '';

  // 收藏开关
  document.getElementById('favToggle').classList.toggle('on', isFavorite);

  document.body.dataset.scrollY = window.scrollY;
  document.body.classList.add('modal-open');

  addModal.classList.add('show');

// ========== 事件：图片上传 ==========
const imageInput = document.getElementById('imageInput');
const previewContainer = document.getElementById('previewContainer');
const previewImg = document.getElementById('previewImg');
const uploadArea = document.getElementById('uploadArea');

// 点击上传区域 → 弹出文件选择器（排除 input 自身，防止双重触发）
uploadArea.addEventListener('click', (e) => {
  if (e.target !== imageInput) imageInput.click();
});

imageInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('请选择图片文件');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    showToast('图片不能超过10MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    const base64 = ev.target.result;
    // 先用 base64 预览
    previewImg.src = base64;
    previewContainer.classList.add('show');
    uploadArea.style.display = 'none';
    imagePosition = 50;
    document.getElementById('positionSlider').value = 50;
    document.getElementById('positionPreviewImg').src = base64;
    document.getElementById('positionPreviewImg').style.objectPosition = 'center 50%';
    document.getElementById('positionPicker').classList.add('show');
    // 通过 nativeBridge 持久化存储，只存文件名
    if (window.nativeBridge) {
      const savedName = nativeBridge.saveImage(base64);
      if (savedName) {
        selectedImage = savedName;
      } else {
        showToast('图片保存失败');
        selectedImage = '';
      }
    } else {

  };

});

document.getElementById('submitBtn').addEventListener('click', () => {
  const title = document.getElementById('titleInput').value.trim();
  const date = document.getElementById('dateInput').value;
  const desc = document.getElementById('descInput').value.trim();

  if (!title) {
    showToast('请输入标题');
    return;
  }
  if (!date) {
    showToast('请选择日期');
    return;
  }
  if (!selectedCategory) {
    showToast('请选择分类');
    return;
  }

  let toastMsg;
  if (editingId) {
    // 编辑模式：更新已有纪念日
    const idx = memorials.findIndex(x => x.id === editingId);
    if (idx !== -1) {
      const oldImage = memorials[idx].image;
      memorials[idx].title = title;
      memorials[idx].date = date;
      memorials[idx].desc = desc;
      memorials[idx].category = selectedCategory;
      memorials[idx].image = selectedImage;
      memorials[idx].imagePosition = imagePosition;
      memorials[idx].favorite = isFavorite;
      // 清理旧图片（如果是文件名且已更换）
      if (oldImage && oldImage !== selectedImage && !oldImage.startsWith('data:') && window.nativeBridge) {
        try { window.nativeBridge.deleteImage(oldImage); } catch(e) {}
      }
    }
    toastMsg = '✏️ 已更新';
    editingId = null;
  } else {
    // 新增模式
    // 从设置页读取默认值
    const defaultRepeat = localStorage.getItem('reminder_default_repeat') || 'yearly';
    const defaultRemindDays = parseInt(localStorage.getItem('reminder_days_before') || '3');
    const newItem = {
      id: Date.now(),
      title,
      date,
      desc,
      category: selectedCategory,
      image: selectedImage,
      imagePosition: imagePosition,
      favorite: isFavorite,
      repeatType: defaultRepeat,        // 每年/每月/每周/无
      remindDays: defaultRemindDays,    // 提前提醒天数
      dateType: currentDateType  // 农历/公历
    };
    memorials.unshift(newItem);
    toastMsg = '✅ 添加成功！';
  }
  saveData(memorials);
  syncToNative();

  document.body.classList.remove('modal-open');
  addModal.classList.remove('show');
  renderFeatured();
  renderList();
  showToast(toastMsg);
});

// ========== 键盘检测 ==========
(function() {
  const body = document.body;
  let initialHeight = window.innerHeight;
  const THRESHOLD = 120; // 键盘弹出的最小高度变化

  // 方案1: visualViewport API (Android WebView 61+)
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const heightDiff = initialHeight - window.visualViewport.height;
      // 当输入框获焦时，强制保持 keyboard-open，防止竞态移除
      const hasInputFocus = document.activeElement &&
        (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');
      if (heightDiff > THRESHOLD || hasInputFocus) {
        body.classList.add('keyboard-open');
      } else {
        body.classList.remove('keyboard-open');
      }
    });
  }

  // 方案2: focus/blur 兜底
  document.addEventListener('focusin', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      body.classList.add('keyboard-open');
    }
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      setTimeout(() => {
        if (!document.activeElement || 
            (document.activeElement.tagName !== 'INPUT' && 
             document.activeElement.tagName !== 'TEXTAREA')) {
          body.classList.remove('keyboard-open');
        }
      }, 100);
    }
  });

  // 页面加载时更新基准高度
  window.addEventListener('load', () => {
    initialHeight = window.innerHeight;
  });

  // 全屏图片查看器
  window.openFullscreenViewer = function(src) {
    if (!src) return;
    const viewer = document.getElementById('fullscreenImgViewer');
    const img = document.getElementById('fvImg');
    img.src = src;
    viewer.classList.add('active');
    try { window.nativeBridge.setBottomNavVisibility(false); } catch(e) {}
  };
  window.closeFullscreenViewer = function() {
    const viewer = document.getElementById('fullscreenImgViewer');
    viewer.classList.remove('active');
    document.getElementById('fvImg').src = '';
    try { window.nativeBridge.setBottomNavVisibility(true); } catch(e) {}
  };
  // 延迟绑定，因为 DOM 元素在 script 之后
  document.addEventListener('DOMContentLoaded', function() {
    var fvClose = document.getElementById('fvClose');
    var fvViewer = document.getElementById('fullscreenImgViewer');
    if (fvClose) fvClose.addEventListener('click', closeFullscreenViewer);
    if (fvViewer) fvViewer.addEventListener('click', function(e) {
      if (e.target === this) closeFullscreenViewer();
    });
  });
})();
// ===== 深色模式：读取用户设置，未设置则跟随系统 =====
(function() {
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(v) {
    if (v) document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');
  }
  // 优先读用户在设置页保存的偏好
  var saved = localStorage.getItem('darkMode');
  if (saved === 'on') {
    apply(true);
  } else if (saved === 'off') {
    apply(false);
  } else {
    // 用户未手动设置，跟随系统
    apply(mql.matches);
    mql.addEventListener('change', function(e) { apply(e.matches); });
  }
  // 监听其他页面（设置页）修改 localStorage 后的同步
  window.addEventListener('storage', function(e) {
    if (e.key === 'darkMode') {
      if (e.newValue === 'on') apply(true);
      else if (e.newValue === 'off') apply(false);
      else apply(mql.matches);
    }
  });
})();

    pink:   { light: { p:'#EC4899', pl:'#F9A8D4', pd:'#BE185D', sh:'rgba(236,72,153,.15)' }, dark: { p:'#F472B6', pl:'#DB2777', pd:'#9D174D', sh:'rgba(244,114,182,.2)' } },
    rose:   { light: { p:'#F43F5E', pl:'#FDA4AF', pd:'#BE123C', sh:'rgba(244,63,94,.15)' }, dark: { p:'#FB7185', pl:'#E11D48', pd:'#9F1239', sh:'rgba(251,113,133,.2)' } },
    teal:   { light: { p:'#14B8A6', pl:'#5EEAD4', pd:'#0F766E', sh:'rgba(20,184,166,.15)' }, dark: { p:'#2DD4BF', pl:'#0D9488', pd:'#115E59', sh:'rgba(45,212,191,.2)' } },

  };
  function getDark() {
    var dm = localStorage.getItem('darkMode');
    if (dm === 'on') return true;
    if (dm === 'off') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyTheme(name) {
    var theme = THEMES[name] || THEMES.purple;
    var c = theme[getDark() ? 'dark' : 'light'];
    var s = document.documentElement.style;
    s.setProperty('--primary', c.p);
    s.setProperty('--primary-light', c.pl);
    s.setProperty('--primary-dark', c.pd);
    s.setProperty('--shadow', '0 4px 20px ' + c.sh);
    s.setProperty('--fab-shadow', c.sh.replace(/[\d.]+\)$/, '0.45)'));
  }
  applyTheme(localStorage.getItem('themeColor') || 'purple');
  window.addEventListener('storage', function(e) {
    if (e.key === 'themeColor') applyTheme(e.newValue || 'purple');
    if (e.key === 'darkMode') applyTheme(localStorage.getItem('themeColor') || 'purple');
  });
})();

// ========== 自定义日期选择器 ==========
(function() {
  const input = document.getElementById('dateInput');
  const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  Object.defineProperty(input, 'value', {
    get: function() { return desc.get.call(this); },
    set: function(v) {
      desc.set.call(this, v);
      syncDatePickerDisplay(v);
    }
  });
})();

function syncDatePickerDisplay(val) {
  const text = document.getElementById('datePickerText');
  if (!text) return;
  if (val) {
    const p = val.split('-');
    if (p.length === 3) {
      text.textContent = p[0] + '年' + parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
      text.classList.remove('placeholder');
    } else {
      text.textContent = val;
      text.classList.remove('placeholder');
    }
  } else {
    text.textContent = '选择日期';
    text.classList.add('placeholder');
  }
}

let dpYear, dpMonth, dpSelectedDate;

function openDatePicker() {
  const val = document.getElementById('dateInput').value;
  if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
    const parts = val.split('-');
    dpYear = parseInt(parts[0]);
    dpMonth = parseInt(parts[1]) - 1;
    dpSelectedDate = val;
  } else {
    const now = new Date();
    dpYear = now.getFullYear();
    dpMonth = now.getMonth();
    dpSelectedDate = '';
  }
  renderCalendar();
  document.getElementById('dpOverlay').classList.add('show');
}

function renderCalendar() {
  document.getElementById('dpMonthTitle').textContent = dpYear + '年' + (dpMonth + 1) + '月';
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const firstDay = new Date(dpYear, dpMonth, 1).getDay();
  const startOffset = (firstDay + 6) % 7;
  const daysInMonth = new Date(dpYear, dpMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(dpYear, dpMonth, 0).getDate();
  let html = '';
  for (let i = startOffset - 1; i >= 0; i--) {
    html += '<div class="dp-day other-month">' + (daysInPrevMonth - i) + '</div>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dpYear + '-' + String(dpMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const cls = ['dp-day'];
    if (ds === todayStr) cls.push('today');
    if (ds === dpSelectedDate) cls.push('selected');
    html += '<div class="' + cls.join(' ') + '" onclick="selectDate(\'' + ds + '\')">' + d + '</div>';
  }
  const totalCells = startOffset + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    html += '<div class="dp-day other-month">' + i + '</div>';
  }
  document.getElementById('dpDays').innerHTML = html;
}

function selectDate(dateStr) {
  dpSelectedDate = dateStr;
  renderCalendar();
}

function dpPrevMonth() {
  dpMonth--;
  if (dpMonth < 0) { dpMonth = 11; dpYear--; }
  renderCalendar();
}

function dpNextMonth() {
  dpMonth++;
  if (dpMonth > 11) { dpMonth = 0; dpYear++; }
  renderCalendar();
}

function dpConfirm() {
  if (dpSelectedDate) {
    document.getElementById('dateInput').value = dpSelectedDate;
  }
  document.getElementById('dpOverlay').classList.remove('show');
}

function dpCancel() {
  document.getElementById('dpOverlay').classList.remove('show');
}

// ========== 年份选择器 ==========
function toggleYearPicker() {
  const yearPanel = document.getElementById('dpYearPanel');
  const nav = document.querySelector('.dp-nav');
  const weekdays = document.querySelector('.dp-weekdays');
  const days = document.getElementById('dpDays');
  const isShowing = yearPanel.classList.contains('show');

  if (isShowing) {
    yearPanel.classList.remove('show');
    yearPanel.style.opacity = '0';
    nav.style.display = '';
    weekdays.style.display = '';
    days.style.display = '';
  } else {
    renderYearGrid();
    nav.style.display = 'none';
    weekdays.style.display = 'none';
    days.style.display = 'none';
    yearPanel.classList.add('show');
    // trigger reflow for transition
    void yearPanel.offsetHeight;
    yearPanel.style.opacity = '1';
  }
}

function renderYearGrid() {
  const grid = document.getElementById('dpYearGrid');
  const curYear = dpYear;
  const startYear = curYear - 50;
  const endYear = curYear + 50;
  let html = '';
  for (let y = startYear; y <= endYear; y++) {
    const cls = y === curYear ? 'dp-year-item current' : 'dp-year-item';
    html += '<div class="' + cls + '" onclick="selectYear(' + y + ')">' + y + '</div>';
  }
  grid.innerHTML = html;
  // 滚动到当前年份
  setTimeout(() => {
    const cur = grid.querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'center', behavior: 'instant' });
  }, 60);
}

function selectYear(year) {
  dpYear = year;
  toggleYearPicker();
  renderCalendar();
}

// ========== Android 系统返回手势拦截 ==========
// 由 HomeFragment.kt 的 OnBackPressedCallback 调用
// 返回 'handled' 表示弹窗已关闭，不退出 app；返回 'exit' 表示可以退出
window.__handleBackPress = function() {
  // 按 z-index 从高到低检查弹窗，优先关闭最顶层
  // 1. 全屏图片查看器 (z-index: 10000)
  var fv = document.getElementById('fullscreenImgViewer');
  if (fv && fv.classList.contains('active')) {
    closeFullscreenViewer();
    return 'handled';
  }
  // 2. 删除确认弹窗 / 操作结果弹窗 / 自定义分类弹窗 (z-index: 300)
  var dc = document.getElementById('dcOverlay');
  if (dc && dc.classList.contains('show')) {
    dc.classList.remove('show');
    return 'handled';
  }
  var al = document.getElementById('alOverlay');
  if (al && al.classList.contains('show')) {
    al.classList.remove('show');
    return 'handled';
  }
  var cc = document.getElementById('ccOverlay');
  if (cc && cc.classList.contains('show')) {
    cc.classList.remove('show');
    return 'handled';
  }
  // 3. 日期选择器 (z-index: 可能有)
  var dp = document.getElementById('dpOverlay');
  if (dp && dp.classList.contains('show')) {
    dp.classList.remove('show');
    return 'handled';
  }
  // 4. 详情弹窗 / 添加编辑弹窗 (z-index: 200)
  var detail = document.getElementById('detailModal');
  if (detail && detail.classList.contains('show')) {
    detail.classList.remove('show');
    document.body.classList.remove('modal-open');
    return 'handled';
  }
  var modal = document.getElementById('addModal');
  if (modal && modal.classList.contains('show')) {
    modal.classList.remove('show');
    document.body.classList.remove('modal-open');
    return 'handled';
  }
  // 无弹窗打开，返回 exit 让 Kotlin 执行默认退出逻辑
  return 'exit';
};
