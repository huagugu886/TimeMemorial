<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>时光纪念</title>
    <style>
        :root {
            --primary: #7C5CFC;
            --primary-light: #9B8AFF;
            --bg: #F5F5FA;
            --card: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --radius: 16px;

            /* 分类颜色 */
            --tag-love: #FF6B9D;
            --tag-birthday: #FF9F43;
            --tag-travel: #54A0FF;
            --tag-work: #5F27CD;
            --tag-other: #636E72;
            --tag-memorial: #EE5A24;
            --tag-favorite: #EE5A24;
            --tag-collection: #EE5A24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        /* 顶部 */
        .header {
            padding: 20px 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #FF6B9D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 搜索栏 */
        .search-bar {
            margin: 16px 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            background: var(--card);
            outline: none;
            color: var(--text);
            -webkit-appearance: none;
        }

        .search-input:focus { border-color: var(--primary); }
        .search-input::placeholder { color: #9CA3AF; }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #9CA3AF;
        }

        /* 分类标签栏 */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 0 20px;
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .tab:active { transform: scale(0.95); }

        .tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 自定义分类标签删除指示器 */
        .tab[data-custom]::after {
            content: '×';
            display: none;
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            background: #FF4444;
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
        }

        .tab[data-custom].deleting::after { display: block; }

        /* 统计卡 */
        .stats-card {
            margin: 0 20px 20px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius);
            color: #fff;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item { flex: 1; }
        .stat-num {
            font-size: 28px;
            font-weight: 800;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* 内容列表 */
        .content { padding: 0 20px; }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 纪念日卡片 */
        .memory-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .memory-card:active { transform: scale(0.98); }

        .memory-emoji {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .memory-info { flex: 1; min-width: 0; }

        .memory-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .memory-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .memory-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .memory-days {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            flex-shrink: 0;
            text-align: right;
        }

        .memory-days small {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { font-size: 15px; }

        /* 添加按钮 FAB */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 28px;
            border: none;
            box-shadow: 0 4px 16px rgba(124,92,252,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: all 0.2s;
        }

        .fab:active { transform: scale(0.9); }

        /* 删除确认弹窗 */
        .delete-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .delete-modal-overlay.show { display: flex; }

        .delete-modal {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        .delete-modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .delete-modal-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

        .delete-modal-buttons { display: flex; gap: 12px; }

        .delete-modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-modal-btn:active { transform: scale(0.97); }
        .delete-modal-cancel { background: var(--bg); color: var(--text-secondary); }
        .delete-modal-confirm { background: #FF4444; color: #fff; }
    </style>
</head>
<body>
    <!-- 顶部 -->
    <div class="header">
        <div>
            <div class="header-title">✨ 时光纪念</div>
            <div class="header-subtitle" id="dateDisplay"></div>
        </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索纪念日…">
    </div>

    <!-- 分类标签 -->
    <div class="tabs" id="tabsContainer">
        <div class="tab active" data-category="all">全部</div>
        <div class="tab" data-category="love">💕 爱情</div>
        <div class="tab" data-category="birthday">🎂 生日</div>
        <div class="tab" data-category="travel">✈️ 旅行</div>
        <div class="tab" data-category="work">💼 工作</div>
        <div class="tab" data-category="memorial">🎉 纪念</div>
        <div class="tab" data-category="other">📎 其他</div>
        <!-- 自定义分类会动态插入到这里 -->
    </div>

    <!-- 统计卡 -->
    <div class="stats-card">
        <div class="stat-item">
            <div class="stat-num" id="totalCount">0</div>
            <div class="stat-label">总纪念日</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" id="upcomingCount">0</div>
            <div class="stat-label">即将到来</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" id="daysCount">0</div>
            <div class="stat-label">累计天数</div>
        </div>
    </div>

    <!-- 内容列表 -->
    <div class="content" id="contentList"></div>

    <!-- 添加按钮 -->
    <button class="fab" onclick="location.href='add_page.html'">＋</button>

    <!-- 删除分类确认弹窗 -->
    <div class="delete-modal-overlay" id="deleteModal">
        <div class="delete-modal">
            <div class="delete-modal-title">🗑️ 删除自定义分类</div>
            <div class="delete-modal-desc" id="deleteModalDesc">确定要删除该分类吗？已使用该分类的纪念日会自动归入"其他"。</div>
            <div class="delete-modal-buttons">
                <button class="delete-modal-btn delete-modal-cancel" id="deleteCancelBtn">取消</button>
                <button class="delete-modal-btn delete-modal-confirm" id="deleteConfirmBtn">删除</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 分类映射 ==========
        const DEFAULT_CATEGORY_MAP = {
            love: { name: '爱情', emoji: '💕', color: '#FF6B9D' },
            birthday: { name: '生日', emoji: '🎂', color: '#FF9F43' },
            travel: { name: '旅行', emoji: '✈️', color: '#54A0FF' },
            work: { name: '工作', emoji: '💼', color: '#5F27CD' },
            memorial: { name: '纪念', emoji: '🎉', color: '#EE5A24' },
            life: { name: '生活', emoji: '🌟', color: '#54A0FF' },
            other: { name: '其他', emoji: '📎', color: '#636E72' }
        };

        const CUSTOM_STORAGE_KEY = 'custom_categories';
        const MEMORIES_KEY = 'memories';

        let categoryMap = { ...DEFAULT_CATEGORY_MAP };
        let currentFilter = 'all';
        let searchQuery = '';
        let deleteTargetKey = null;

        // ========== 初始化 ==========
        function init() {
            loadCustomCategories();
            renderTabs();
            updateDateDisplay();
            renderMemories();
            bindEvents();
        }

        // ========== 加载自定义分类 ==========
        function loadCustomCategories() {
            const customs = JSON.parse(localStorage.getItem(CUSTOM_STORAGE_KEY) || '[]');
            customs.forEach(cat => {
                categoryMap[cat.key] = {
                    name: cat.name,
                    emoji: cat.emoji,
                    color: cat.color,
                    isCustom: true
                };
            });
        }

        // ========== 渲染标签栏 ==========
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            const customs = JSON.parse(localStorage.getItem(CUSTOM_STORAGE_KEY) || '[]');

            // 保留默认标签，清除自定义标签
            container.querySelectorAll('.tab[data-custom]').forEach(el => el.remove());

            // 添加自定义标签
            customs.forEach(cat => {
                const tab = document.createElement('div');
                tab.className = 'tab';
                tab.dataset.category = cat.key;
                tab.dataset.custom = 'true';
                tab.textContent = cat.emoji + ' ' + cat.name;
                container.appendChild(tab);
            });
        }

        // ========== 渲染纪念日列表 ==========
        function renderMemories() {
            const memories = JSON.parse(localStorage.getItem(MEMORIES_KEY) || '[]');
            const content = document.getElementById('contentList');
            const today = new Date();

            // 筛选
            let filtered = memories;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(m => m.category === currentFilter);
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(m =>
                    m.title.toLowerCase().includes(q) ||
                    (m.note && m.note.toLowerCase().includes(q))
                );
            }

            // 按日期排序（最近的在前）
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            // 更新统计
            updateStats(memories);

            // 空状态
            if (filtered.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📅</div>
                        <div class="empty-text">${searchQuery ? '没有找到匹配的纪念日' : '还没有纪念日，点击右下角 ＋ 添加'}</div>
                    </div>
                `;
                return;
            }

            // 渲染卡片
            content.innerHTML = filtered.map(memory => {
                const cat = categoryMap[memory.category] || categoryMap.other;
                const memDate = new Date(memory.date);
                const diffDays = Math.floor((today - memDate) / (1000 * 60 * 60 * 24));
                const daysText = diffDays >= 0 ? diffDays : Math.abs(diffDays);
                const daysLabel = diffDays >= 0 ? '天前' : '天后';

                return `
                    <div class="memory-card" data-id="${memory.id}">
                        <div class="memory-emoji" style="background: ${cat.color}22; color: ${cat.color};">
                            ${cat.emoji}
                        </div>
                        <div class="memory-info">
                            <div class="memory-title">${escapeHtml(memory.title)}</div>
                            <div class="memory-meta">
                                <span>${memory.date}</span>
                                <span class="memory-tag" style="background: ${cat.color}22; color: ${cat.color};">
                                    ${cat.name}
                                </span>
                            </div>
                        </div>
                        <div class="memory-days" style="color: ${cat.color};">
                            ${daysText}
                            <small>${daysLabel}</small>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== 更新统计 ==========
        function updateStats(memories) {
            const today = new Date();
            document.getElementById('totalCount').textContent = memories.length;

            // 即将到来（未来30天内）
            const upcoming = memories.filter(m => {
                const d = new Date(m.date);
                const diff = d - today;
                return diff > 0 && diff < 30 * 24 * 60 * 60 * 1000;
            });
            document.getElementById('upcomingCount').textContent = upcoming.length;

            // 累计天数
            if (memories.length > 0) {
                const earliest = new Date(Math.min(...memories.map(m => new Date(m.date))));
                const totalDays = Math.floor((today - earliest) / (1000 * 60 * 60 * 24));
                document.getElementById('daysCount').textContent = totalDays;
            } else {
                document.getElementById('daysCount').textContent = 0;
            }
        }

        // ========== 更新日期显示 ==========
        function updateDateDisplay() {
            const today = new Date();
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            const dateStr = `${today.getMonth() + 1}月${today.getDate()}日 星期${weekDays[today.getDay()]}`;
            document.getElementById('dateDisplay').textContent = dateStr;
        }

        // ========== 绑定事件 ==========
        function bindEvents() {
            const tabsContainer = document.getElementById('tabsContainer');

            // 标签点击
            tabsContainer.addEventListener('click', function(e) {
                const tab = e.target.closest('.tab');
                if (!tab) return;

                tabsContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.category;
                renderMemories();
            });

            // 自定义标签长按删除
            let longPressTimer = null;
            tabsContainer.addEventListener('touchstart', function(e) {
                const tab = e.target.closest('.tab[data-custom]');
                if (!tab) return;
                longPressTimer = setTimeout(() => {
                    tab.classList.add('deleting');
                    deleteTargetKey = tab.dataset.category;
                    document.getElementById('deleteModal').classList.add('show');
                }, 600);
            });

            tabsContainer.addEventListener('touchend', function() {
                clearTimeout(longPressTimer);
                tabsContainer.querySelectorAll('.tab.deleting').forEach(t => t.classList.remove('deleting'));
            });

            tabsContainer.addEventListener('touchmove', function() {
                clearTimeout(longPressTimer);
                tabsContainer.querySelectorAll('.tab.deleting').forEach(t => t.classList.remove('deleting'));
            });

            // 搜索
            document.getElementById('searchInput').addEventListener('input', function() {
                searchQuery = this.value.trim();
                renderMemories();
            });

            // 删除弹窗取消
            document.getElementById('deleteCancelBtn').addEventListener('click', function() {
                document.getElementById('deleteModal').classList.remove('show');
                deleteTargetKey = null;
            });

            // 删除弹窗确认
            document.getElementById('deleteConfirmBtn').addEventListener('click', function() {
                if (deleteTargetKey) {
                    deleteCustomCategory(deleteTargetKey);
                    deleteTargetKey = null;
                }
                document.getElementById('deleteModal').classList.remove('show');
            });

            // 点击遮罩关闭删除弹窗
            document.getElementById('deleteModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                    deleteTargetKey = null;
                }
            });
        }

        // ========== 删除自定义分类 ==========
        function deleteCustomCategory(key) {
            // 从 localStorage 移除
            let customs = JSON.parse(localStorage.getItem(CUSTOM_STORAGE_KEY) || '[]');
            customs = customs.filter(c => c.key !== key);
            localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(customs));

            // 从 categoryMap 移除
            delete categoryMap[key];

            // 把使用该分类的纪念日归入 other
            const memories = JSON.parse(localStorage.getItem(MEMORIES_KEY) || '[]');
            let changed = false;
            memories.forEach(m => {
                if (m.category === key) {
                    m.category = 'other';
                    changed = true;
                }
            });
            if (changed) {
                localStorage.setItem(MEMORIES_KEY, JSON.stringify(memories));
            }

            // 如果当前筛选的是被删除的分类，切回全部
            if (currentFilter === key) {
                currentFilter = 'all';
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelector('.tab[data-category="all"]').classList.add('active');
            }

            // 重新渲染
            renderTabs();
            renderMemories();
        }

        // ========== 工具函数 ==========
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 启动
        init();
    </script>
</body>
</html>
