<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>设置</title>
<style>
  :root {
    --bg: #F2F0F7;
    --card-bg: #FFFFFF;
    --primary: #8B5CF6;
    --text: #1F2937;
    --text-sec: #9CA3AF;
    --divider: #F3F4F6;
    --switch-off: #E5E7EB;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 20px 40px;
  }

  /* 顶部 */
  .header { padding: 52px 4px 20px; }
  .header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }

  /* 分组 */
  .group {
    background: var(--card-bg);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .group-head {
    padding: 16px 20px 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sec);
    letter-spacing: 0.3px;
  }

  /* 行 */
  .row {
    display: flex;
    align-items: center;
    padding: 13px 20px;
    gap: 14px;
    position: relative;
    transition: background .12s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .row:active { background: var(--divider); }
  .row + .row::before {
    content: '';
    position: absolute;
    top: 0; left: 54px; right: 0;
    height: 1px;
    background: var(--divider);
  }

  /* 图标 */
  .ico {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .ico-p { background: rgba(139,92,246,.15); }
  .ico-b { background: rgba(59,130,246,.15); }
  .ico-k { background: rgba(236,72,153,.15); }
  .ico-o { background: rgba(251,191,36,.15); }
  .ico-g { background: rgba(16,185,129,.15); }
  .ico-r { background: rgba(239,68,68,.15); }
  .ico-w { background: rgba(107,114,128,.15); }

  /* 文字区 */
  .txt { flex: 1; min-width: 0; }
  .txt-main { font-size: 16px; font-weight: 450; line-height: 1.3; }
  .txt-sub { font-size: 12px; color: var(--text-sec); margin-top: 1px; }

  /* 右侧 */
  .right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .val { font-size: 15px; color: var(--text-sec); }
  .chev { color: #D1D5DB; font-size: 13px; font-weight: 600; }

  /* 开关 */
  .sw { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw .sl {
    position: absolute; inset: 0; background: var(--switch-off);
    border-radius: 16px; transition: background .25s; cursor: pointer;
  }
  .sw .sl::before {
    content: ''; position: absolute; width: 27px; height: 27px;
    left: 2px; top: 2px; background: #fff; border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .25s;
  }
  .sw input:checked + .sl { background: var(--primary); }
  .sw input:checked + .sl::before { transform: translateX(20px); }

  /* 主题色 — 内嵌在卡片行内 */
  .colors {
    display: flex; gap: 12px; padding: 4px 20px 16px;
  }
  .dot {
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; transition: transform .15s, box-shadow .2s, border-color .2s;
    border: 2.5px solid transparent;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .dot:active { transform: scale(.92); }
  .dot.on {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139,92,246,.25), 0 2px 8px rgba(139,92,246,.3);
  }
  .c1 { background: #8B5CF6; }
  .c2 { background: #3B82F6; }
  .c3 { background: #EC4899; }
  .c4 { background: #F43F5E; }
  .c5 { background: #14B8A6; }

  /* 主题色切换 — 动态图标背景 & 底部图标 */
  [data-theme="purple"] .ico-p { background: rgba(139,92,246,.15); }
  [data-theme="blue"] .ico-p { background: rgba(59,130,246,.15); }
  [data-theme="pink"] .ico-p { background: rgba(236,72,153,.15); }
  [data-theme="rose"] .ico-p { background: rgba(244,63,94,.15); }
  [data-theme="teal"] .ico-p { background: rgba(20,184,166,.15); }

  [data-theme="purple"] .dot.on { border-color: #8B5CF6; box-shadow: 0 0 0 3px rgba(139,92,246,.25), 0 2px 8px rgba(139,92,246,.3); }
  [data-theme="blue"] .dot.on { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,.25), 0 2px 8px rgba(59,130,246,.3); }
  [data-theme="pink"] .dot.on { border-color: #EC4899; box-shadow: 0 0 0 3px rgba(236,72,153,.25), 0 2px 8px rgba(236,72,153,.3); }
  [data-theme="rose"] .dot.on { border-color: #F43F5E; box-shadow: 0 0 0 3px rgba(244,63,94,.25), 0 2px 8px rgba(244,63,94,.3); }
  [data-theme="teal"] .dot.on { border-color: #14B8A6; box-shadow: 0 0 0 3px rgba(20,184,166,.25), 0 2px 8px rgba(20,184,166,.3); }

  [data-theme="purple"] .foot-ico { background: linear-gradient(135deg, #8B5CF6, #A78BFA); box-shadow: 0 4px 16px rgba(139,92,246,.2); }
  [data-theme="blue"] .foot-ico { background: linear-gradient(135deg, #3B82F6, #60A5FA); box-shadow: 0 4px 16px rgba(59,130,246,.2); }
  [data-theme="pink"] .foot-ico { background: linear-gradient(135deg, #EC4899, #F472B6); box-shadow: 0 4px 16px rgba(236,72,153,.2); }
  [data-theme="rose"] .foot-ico { background: linear-gradient(135deg, #F43F5E, #FB7185); box-shadow: 0 4px 16px rgba(244,63,94,.2); }
  [data-theme="teal"] .foot-ico { background: linear-gradient(135deg, #14B8A6, #2DD4BF); box-shadow: 0 4px 16px rgba(20,184,166,.2); }

  /* 底部版本 */
  .foot {
    text-align: center; padding: 32px 0 0;
  }
  .foot-ico {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 10px;
    background: linear-gradient(135deg, #8B5CF6, #A78BFA);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 16px rgba(139,92,246,.2);
  }
  .foot-name { font-size: 16px; font-weight: 600; }
  .foot-ver { font-size: 12px; color: var(--text-sec); margin-top: 2px; }

  /* === 选择器弹窗 === */
  .picker-mask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.35); z-index: 999;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .picker-mask.show { opacity: 1; pointer-events: auto; }
  .picker-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: var(--card-bg);
    border-radius: 16px 16px 0 0;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
  }
  .picker-sheet.show { transform: translateY(0); }
  .picker-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; border-bottom: 1px solid var(--divider);
  }
  .picker-head .picker-title { font-size: 16px; font-weight: 700; }
  .picker-head .picker-done {
    font-size: 15px; font-weight: 600; color: var(--primary);
    background: none; border: none; cursor: pointer; padding: 4px 8px;
  }
  .picker-list {
    max-height: 320px; overflow-y: auto; padding: 8px 0;
    -webkit-overflow-scrolling: touch;
  }
  .picker-opt {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; font-size: 16px; cursor: pointer;
    transition: background .1s;
  }
  .picker-opt:active { background: var(--divider); }
  .picker-opt .check { color: var(--primary); font-size: 18px; font-weight: 700; opacity: 0; }
  .picker-opt.active .check { opacity: 1; }

  /* 自定义时间滚轮选择器 */
  .time-wheel-wrap {
    display: flex; align-items: center; justify-content: center;
    padding: 12px 0 8px; position: relative; height: 220px; gap: 0;
  }
  .wheel-col {
    width: 80px; height: 220px; overflow-y: scroll;
    scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .wheel-col::-webkit-scrollbar { display: none; }
  .wheel-pad { height: 90px; flex-shrink: 0; }
  .wheel-item {
    height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 500; color: var(--text-sec);
    scroll-snap-align: center; transition: color .15s, transform .15s, font-weight .15s;
    flex-shrink: 0;
  }
  .wheel-item.active {
    color: var(--text); font-weight: 700; font-size: 26px;
  }
  .wheel-sep {
    font-size: 28px; font-weight: 700; color: var(--text);
    width: 30px; text-align: center; flex-shrink: 0;
    line-height: 40px;
  }
  .wheel-highlight {
    position: absolute; left: 20px; right: 20px; top: 90px; height: 40px;
    background: var(--primary); opacity: 0.07; border-radius: 10px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="header"><h1>设置</h1></div>

<!-- 外观 -->
<div class="group">
  <div class="group-head">外观</div>
  <div class="row">
    <div class="ico ico-p">🌙</div>
    <div class="txt"><div class="txt-main">深色模式</div></div>
    <label class="sw"><input type="checkbox" id="dm"><span class="sl"></span></label>
  </div>
  <div class="row">
    <div class="ico ico-b">🎨</div>
    <div class="txt"><div class="txt-main">主题色</div></div>
  </div>
  <div class="colors">
    <div class="dot c1 on" data-c="purple"></div>
    <div class="dot c2" data-c="blue"></div>
    <div class="dot c3" data-c="pink"></div>
    <div class="dot c4" data-c="rose"></div>
    <div class="dot c5" data-c="teal"></div>
  </div>
  <div class="row" style="display:none">
    <div class="ico ico-o">🔤</div>
    <div class="txt"><div class="txt-main">字体大小（开发中）</div></div>
    <div class="right"><span class="val">标准</span><span class="chev">›</span></div>
  </div>
</div>

<!-- 纪念日提醒 -->
<div class="group">
  <div class="group-head">纪念日提醒</div>
  <div class="row">
    <div class="ico ico-k">🔔</div>
    <div class="txt">
      <div class="txt-main">纪念日提醒</div>
      <div class="txt-sub">在纪念日前提醒你</div>
    </div>
    <label class="sw"><input type="checkbox" checked><span class="sl"></span></label>
  </div>
  <div class="row" id="rowDays">
    <div class="ico ico-o">⏰</div>
    <div class="txt"><div class="txt-main">提前提醒</div></div>
    <div class="right"><span class="val">3 天</span><span class="chev">›</span></div>
  </div>
  <div class="row" id="rowTime">
    <div class="ico ico-b">🕘</div>
    <div class="txt"><div class="txt-main">提醒时间</div></div>
    <div class="right"><span class="val">09:00</span><span class="chev">›</span></div>
  </div>
  <div class="row" id="rowRepeat">
    <div class="ico ico-p">🔁</div>
    <div class="txt"><div class="txt-main">默认重复</div></div>
    <div class="right"><span class="val">每年</span><span class="chev">›</span></div>
  </div>
</div>

<!-- 通知（隐藏）
<div class="group" style="display:none">
  <div class="group-head">通知</div>
  <div class="row">
    <div class="ico ico-b">📢</div>
    <div class="txt"><div class="txt-main">通知渠道</div></div>
    <div class="right"><span class="val">灵动岛</span><span class="chev">›</span></div>
  </div>
  <div class="row">
    <div class="ico ico-g">🔊</div>
    <div class="txt"><div class="txt-main">声音与振动</div></div>
    <div class="right"><span class="chev">›</span></div>
  </div>
</div>

<!-- 数据 -->
<div class="group">
  <div class="group-head">数据</div>
  <div class="row">
    <div class="ico ico-g">📤</div>
    <div class="txt"><div class="txt-main">备份与恢复</div></div>
    <div class="right"><span class="chev">›</span></div>
  </div>
  <div class="row">
    <div class="ico ico-w">🗑️</div>
    <div class="txt"><div class="txt-main">清除缓存</div></div>
    <div class="right"><span class="val">12.3 MB</span><span class="chev">›</span></div>
  </div>
  <div class="row">
    <div class="ico ico-b">📦</div>
    <div class="txt"><div class="txt-main">导出数据</div></div>
    <div class="right"><span class="chev">›</span></div>
  </div>
</div>

<!-- 关于 -->
<div class="group">
  <div class="group-head">关于</div>
  <div class="row">
    <div class="ico ico-p">ℹ️</div>
    <div class="txt"><div class="txt-main">版本信息</div></div>
    <div class="right"><span class="val">v2.0.18</span><span class="chev">›</span></div>
  </div>
</div>

<!-- 底部 -->
<div class="foot">
  <div class="foot-ico">🕐</div>
  <div class="foot-name">TimeMemorial</div>
  <div class="foot-ver">Version 2.0.1</div>
</div>

<!-- === 选择器组件 === -->
<div class="picker-mask" id="pickerMask"></div>

<!-- 提前提醒天数选择器 -->
<div class="picker-sheet" id="daysSheet">
  <div class="picker-head">
    <span class="picker-title">提前提醒</span>
    <button class="picker-done" id="daysDone">完成</button>
  </div>
  <div class="picker-list" id="daysList"></div>
</div>

<!-- 提醒时间选择器 -->
<div class="picker-sheet" id="timeSheet">
  <div class="picker-head">
    <span class="picker-title">提醒时间</span>
    <button class="picker-done" id="timeDone">完成</button>
  </div>
  <div class="time-wheel-wrap">
    <div class="wheel-col" id="hourWheel">
      <div class="wheel-pad"></div>
      <div class="wheel-pad"></div>
      <div class="wheel-pad"></div>
    </div>
    <div class="wheel-sep">:</div>
    <div class="wheel-col" id="minWheel">
      <div class="wheel-pad"></div>
      <div class="wheel-pad"></div>
      <div class="wheel-pad"></div>
    </div>
    <div class="wheel-highlight"></div>
  </div>
</div>

<!-- 默认重复选择器 -->
<div class="picker-sheet" id="repeatSheet">
  <div class="picker-head">
    <span class="picker-title">默认重复</span>
    <button class="picker-done" id="repeatDone">完成</button>
  </div>
  <div class="picker-list" id="repeatList"></div>
</div>

<script>
// === 主题色定义 ===
const THEMES = {
  purple: {
    light: { primary: '#8B5CF6', light: '#C4B5FD', dark: '#6D28D9', shadow: 'rgba(139,92,246,0.15)' },
    dark:  { primary: '#A78BFA', light: '#7C3AED', dark: '#5B21B6', shadow: 'rgba(167,139,250,0.2)' }
  },
  blue: {
    light: { primary: '#3B82F6', light: '#93C5FD', dark: '#1D4ED8', shadow: 'rgba(59,130,246,0.15)' },
    dark:  { primary: '#60A5FA', light: '#2563EB', dark: '#1E40AF', shadow: 'rgba(96,165,250,0.2)' }
  },
  pink: {
    light: { primary: '#EC4899', light: '#F9A8D4', dark: '#BE185D', shadow: 'rgba(236,72,153,0.15)' },
    dark:  { primary: '#F472B6', light: '#DB2777', dark: '#9D174D', shadow: 'rgba(244,114,182,0.2)' }
  },
  rose: {
    light: { primary: '#F43F5E', light: '#FDA4AF', dark: '#BE123C', shadow: 'rgba(244,63,94,0.15)' },
    dark:  { primary: '#FB7185', light: '#E11D48', dark: '#9F1239', shadow: 'rgba(251,113,133,0.2)' }
  },
  teal: {
    light: { primary: '#14B8A6', light: '#5EEAD4', dark: '#0F766E', shadow: 'rgba(20,184,166,0.15)' },
    dark:  { primary: '#2DD4BF', light: '#0D9488', dark: '#115E59', shadow: 'rgba(45,212,191,0.2)' }
  }
};

// === 应用主题色 ===
function applyTheme(themeName, isDark) {
  const theme = THEMES[themeName] || THEMES.purple;
  const mode = isDark ? 'dark' : 'light';
  const c = theme[mode];
  const s = document.documentElement.style;
  s.setProperty('--primary', c.primary);
  s.setProperty('--primary-light', c.light);
  s.setProperty('--primary-dark', c.dark);
  s.setProperty('--shadow', '0 4px 20px ' + c.shadow);
  // 标记当前主题色，供 CSS 规则使用
  document.documentElement.setAttribute('data-theme', themeName);
  // 更新圆点选中状态
  document.querySelectorAll('.dot').forEach(function(d) {
    d.classList.toggle('on', d.getAttribute('data-c') === themeName);
  });
}

// === 深色模式逻辑 ===
const dmSwitch = document.getElementById('dm');
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');

function applyDark(dark) {
  const s = document.documentElement.style;
  if (dark) {
    s.setProperty('--bg','#111827'); s.setProperty('--card-bg','#1F2937');
    s.setProperty('--text','#F9FAFB'); s.setProperty('--text-sec','#6B7280');
    s.setProperty('--divider','#374151'); s.setProperty('--switch-off','#4B5563');
  } else {
    s.setProperty('--bg','#F2F0F7'); s.setProperty('--card-bg','#FFFFFF');
    s.setProperty('--text','#1F2937'); s.setProperty('--text-sec','#9CA3AF');
    s.setProperty('--divider','#F3F4F6'); s.setProperty('--switch-off','#E5E7EB');
  }
  // 深色模式切换后重新应用主题色（确保主题色覆盖默认值）
  applyTheme(localStorage.getItem('themeColor') || 'purple', dark);
}

// 初始化深色模式
const saved = localStorage.getItem('darkMode');
if (saved === 'on') {
  dmSwitch.checked = true;
  applyDark(true);
} else if (saved === 'off') {
  dmSwitch.checked = false;
  applyDark(false);
} else {
  dmSwitch.checked = sysDark.matches;
  applyDark(sysDark.matches);
}

// 用户手动切换深色模式 → 保存偏好
dmSwitch.onchange = function() {
  applyDark(this.checked);
  localStorage.setItem('darkMode', this.checked ? 'on' : 'off');
  try { nativeBridge.setDarkMode(this.checked); } catch(e) {}
};

// 监听系统深色模式变化
sysDark.addEventListener('change', (e) => {
  const pref = localStorage.getItem('darkMode');
  if (!pref) {
    dmSwitch.checked = e.matches;
    applyDark(e.matches);
  }
});

// === 主题色选择 ===
document.querySelectorAll('.dot').forEach(function(d) {
  d.onclick = function() {
    var themeName = d.getAttribute('data-c');
    localStorage.setItem('themeColor', themeName);
    var isDark = dmSwitch.checked;
    applyTheme(themeName, isDark);
  };
});

// === 提前提醒 / 提醒时间 / 默认重复 交互 ===
const DAYS_OPTS = [1, 2, 3, 5, 7, 10, 15, 30];
const REPEAT_OPTS = [
  { v: 'none',   label: '不重复' },
  { v: 'weekly', label: '每周' },
  { v: 'monthly',label: '每月' },
  { v: 'yearly', label: '每年' }
];

// 从 localStorage 读取
let reminderDays  = parseInt(localStorage.getItem('reminderDays'))  || 3;
let reminderTime  = localStorage.getItem('reminderTime') || '09:00';
let repeatType    = localStorage.getItem('repeatType')   || 'yearly';

// 初始化显示值
function updateLabels() {
  document.querySelector('#rowDays .val').textContent  = reminderDays + ' 天';
  document.querySelector('#rowTime .val').textContent  = reminderTime;
  var rep = REPEAT_OPTS.find(r => r.v === repeatType);
  document.querySelector('#rowRepeat .val').textContent = rep ? rep.label : '每年';
}
updateLabels();

// 通知 nativeBridge 同步设置
function syncSettings() {
  var s = { reminderDays: reminderDays, reminderTime: reminderTime, repeatType: repeatType };
  try { nativeBridge.updateReminderSettings(JSON.stringify(s)); } catch(e) {}
}

// 弹窗控制
var mask = document.getElementById('pickerMask');
function openSheet(id) {
  mask.classList.add('show');
  document.getElementById(id).classList.add('show');
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
}
function closeAll() {
  mask.classList.remove('show');
  document.querySelectorAll('.picker-sheet').forEach(s => s.classList.remove('show'));
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
}
mask.onclick = closeAll;
mask.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

// --- 提前提醒 ---
(function() {
  var list = document.getElementById('daysList');
  DAYS_OPTS.forEach(function(d) {
    var div = document.createElement('div');
    div.className = 'picker-opt' + (d === reminderDays ? ' active' : '');
    div.setAttribute('data-v', d);
    div.innerHTML = '<span>' + d + ' 天</span><span class="check">✓</span>';
    div.onclick = function() {
      list.querySelectorAll('.picker-opt').forEach(o => o.classList.remove('active'));
      div.classList.add('active');
      reminderDays = d;
    };
    list.appendChild(div);
  });
  document.getElementById('rowDays').onclick = function() {
    // 刷新选中态
    list.querySelectorAll('.picker-opt').forEach(function(o) {
      o.classList.toggle('active', parseInt(o.getAttribute('data-v')) === reminderDays);
    });
    openSheet('daysSheet');
  };
  document.getElementById('daysDone').onclick = function() {
    localStorage.setItem('reminderDays', reminderDays);
    updateLabels(); syncSettings(); closeAll();
  };
})();

// --- 提醒时间（自定义滚轮）---
(function() {
  var hourWheel = document.getElementById('hourWheel');
  var minWheel  = document.getElementById('minWheel');
  var MINS = [0,5,10,15,20,25,30,35,40,45,50,55];
  var ITEM_H = 40;

  // 生成滚轮选项
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  for (var h = 0; h < 24; h++) {
    var d = document.createElement('div');
    d.className = 'wheel-item'; d.textContent = pad2(h); d.setAttribute('data-v', h);
    hourWheel.appendChild(d);
  }
  MINS.forEach(function(m) {
    var d = document.createElement('div');
    d.className = 'wheel-item'; d.textContent = pad2(m); d.setAttribute('data-v', m);
    minWheel.appendChild(d);
  });
  // 底部 padding
  hourWheel.appendChild(document.createElement('div')).className = 'wheel-pad';
  hourWheel.appendChild(document.createElement('div')).className = 'wheel-pad';
  hourWheel.appendChild(document.createElement('div')).className = 'wheel-pad';
  minWheel.appendChild(document.createElement('div')).className = 'wheel-pad';
  minWheel.appendChild(document.createElement('div')).className = 'wheel-pad';
  minWheel.appendChild(document.createElement('div')).className = 'wheel-pad';

  // 解析当前时间
  function parseTime(str) {
    var p = str.split(':');
    return { h: parseInt(p[0]) || 0, m: parseInt(p[1]) || 0 };
  }

  // 滚到指定值（index = 值本身，因为 0-23 和 0-55/5 对应 index）
  function scrollToVal(wheel, valIdx) {
    wheel.scrollTop = valIdx * ITEM_H;
  }

  // 更新高亮
  function updateHighlight(wheel) {
    var items = wheel.querySelectorAll('.wheel-item');
    var center = wheel.scrollTop + 110; // 中心线位置
    var best = null, bestDist = 9999;
    items.forEach(function(it) {
      var top = it.offsetTop;
      var mid = top + ITEM_H / 2;
      var dist = Math.abs(mid - center);
      if (dist < bestDist) { bestDist = dist; best = it; }
    });
    items.forEach(function(it) { it.classList.toggle('active', it === best); });
  }

  // 获取当前选中值
  function getSelected(wheel) {
    var active = wheel.querySelector('.wheel-item.active');
    return active ? parseInt(active.getAttribute('data-v')) : 0;
  }

  // 滚动事件（防抖更新高亮）
  var scrollTimer;
  function onScroll(wheel) {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function() { updateHighlight(wheel); }, 60);
  }
  hourWheel.onscroll = function() { onScroll(hourWheel); };
  minWheel.onscroll  = function() { onScroll(minWheel); };

  // 打开时滚到当前值
  document.getElementById('rowTime').onclick = function() {
    var t = parseTime(reminderTime);
    scrollToVal(hourWheel, t.h);
    scrollToVal(minWheel, MINS.indexOf(t.m) >= 0 ? MINS.indexOf(t.m) : 0);
    // 延迟一帧再更新高亮，等 scrollTop 生效
    setTimeout(function() {
      updateHighlight(hourWheel);
      updateHighlight(minWheel);
    }, 50);
    openSheet('timeSheet');
  };

  // 完成
  document.getElementById('timeDone').onclick = function() {
    var h = getSelected(hourWheel);
    var m = getSelected(minWheel);
    reminderTime = pad2(h) + ':' + pad2(m);
    localStorage.setItem('reminderTime', reminderTime);
    updateLabels(); syncSettings(); closeAll();
  };
})();

// --- 默认重复 ---
(function() {
  var list = document.getElementById('repeatList');
  REPEAT_OPTS.forEach(function(r) {
    var div = document.createElement('div');
    div.className = 'picker-opt' + (r.v === repeatType ? ' active' : '');
    div.setAttribute('data-v', r.v);
    div.innerHTML = '<span>' + r.label + '</span><span class="check">✓</span>';
    div.onclick = function() {
      list.querySelectorAll('.picker-opt').forEach(o => o.classList.remove('active'));
      div.classList.add('active');
      repeatType = r.v;
    };
    list.appendChild(div);
  });
  document.getElementById('rowRepeat').onclick = function() {
    list.querySelectorAll('.picker-opt').forEach(function(o) {
      o.classList.toggle('active', o.getAttribute('data-v') === repeatType);
    });
    openSheet('repeatSheet');
  };
  document.getElementById('repeatDone').onclick = function() {
    localStorage.setItem('repeatType', repeatType);
    updateLabels(); syncSettings(); closeAll();
  };
})();

// 监听其他页面修改设置
window.addEventListener('storage', function(e) {
  if (e.key === 'themeColor') {
    applyTheme(e.newValue || 'purple', dmSwitch.checked);
  }
  if (e.key === 'darkMode') {
    if (e.newValue === 'on') { dmSwitch.checked = true; applyDark(true); }
    else if (e.newValue === 'off') { dmSwitch.checked = false; applyDark(false); }
    else { dmSwitch.checked = sysDark.matches; applyDark(sysDark.matches); }
  }
});
</script>
