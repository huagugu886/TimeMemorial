# Build APK - triggered by push
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK platforms & build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fix build configs for CI
        run: |
          # 修复 local.properties - 指向 CI 的 SDK 路径
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 修复 gradle.properties - 去掉手机本地 aapt2 路径
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeMemorial-debug
          path: app/build/outputs/apk/debug/app-debug.apk
