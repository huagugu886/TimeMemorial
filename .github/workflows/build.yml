name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Clear Gradle Cache
        run: rm -rf ~/.gradle/caches/transforms-* ~/.gradle/caches/modules-2/files-* ~/.gradle/caches/modules-2/metadata-*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Diagnose - show current commit
        run: |
          echo "=== COMMIT INFO ==="
          git log --oneline -3
          echo "=== CURRENT COMMIT ==="
          git rev-parse HEAD
          echo "=== build.gradle.kts HEAD ==="
          head -50 app/build.gradle.kts
          echo "=== themes.xml ==="
          cat app/src/main/res/values/themes.xml

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-build-cache --refresh-dependencies

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-build-cache

      - name: Check APK size
        run: |
          echo "📦 APK Size:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || echo "No APK found"

      - name: Run Lint
        run: ./gradlew lint || true

      - name: Upload Debug APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv ./apk/app-release.apk ./apk/TimeMemorial-v${VERSION}.apk 2>/dev/null || \
          mv ./apk/*.apk .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
